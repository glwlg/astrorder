<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>图片预览</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #0c0d10; color: #fff; overflow: hidden; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .img-container { position: relative; display: flex; align-items: center; justify-content: center; transform-origin: center center; transition: transform 0.05s linear; }
    img { max-width: 90vw; max-height: 88vh; object-fit: contain; border-radius: 6px; box-shadow: 0 16px 40px rgba(0,0,0,.6); pointer-events: auto; }
    .empty { color: #bbb; font-size: 13px; }
    .close {
      position: absolute; top: 16px; right: 18px; width: 36px; height: 36px;
      border: 0; border-radius: 50%; background: rgba(255,255,255,.14); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background .15s; z-index: 100;
    }
    .close:hover { background: rgba(255,255,255,.28); }
    .nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border: 0; border-radius: 22px;
      background: rgba(255,255,255,.12); color: #fff; font-size: 26px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background .15s, opacity .15s; z-index: 100;
    }
    .nav:hover:not(:disabled) { background: rgba(255,255,255,.24); }
    .nav:disabled { opacity: .2; cursor: default; }
    .prev { left: 20px; }
    .next { right: 20px; }
    
    .toolbar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(24, 27, 34, 0.85); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 100; font-size: 12px; color: #d0d7de;
    }
    .tool-btn {
      background: transparent; border: none; color: #e6edf3;
      height: 28px; min-width: 28px; padding: 0 6px; border-radius: 6px;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s; font-size: 13px;
    }
    .tool-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .tool-btn:active { background: rgba(255, 255, 255, 0.22); }
    .tool-divider { width: 1px; height: 16px; background: rgba(255, 255, 255, 0.15); margin: 0 2px; }
    .tool-counter { padding: 0 8px; font-variant-numeric: tabular-nums; opacity: 0.85; font-size: 12px; }
    .tool-zoom { min-width: 48px; font-variant-numeric: tabular-nums; font-weight: 500; }
    .tip-toast {
      position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.9); color: #fff; padding: 4px 12px;
      border-radius: 6px; font-size: 12px; opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="img-container" id="container">
      <img id="image" alt="放大预览" hidden />
    </div>
    <div class="empty" id="empty" hidden>图片无法加载</div>
  </div>
  <button class="close" id="close" aria-label="关闭图片" title="关闭 (Esc)">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
      <path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
  <button class="nav prev" id="prev" aria-label="上一张 (←)" title="上一张 (←)" hidden>‹</button>
  <button class="nav next" id="next" aria-label="下一张 (→)" title="下一张 (→)" hidden>›</button>
  
  <div class="toolbar" id="toolbar">
    <button class="tool-btn" id="btnZoomOut" title="缩小 (-)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="tool-btn tool-zoom" id="btnReset" title="还原比例 (双击图片/0)">100%</button>
    <button class="tool-btn" id="btnZoomIn" title="放大 (+)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <div class="tool-divider"></div>
    <button class="tool-btn" id="btnCopy" title="复制图片到剪贴板 (Ctrl+C)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <button class="tool-btn" id="btnSave" title="保存图片到本地 (Ctrl+S)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <div class="tool-divider" id="counterDivider" hidden></div>
    <div class="tool-counter" id="counter" hidden></div>
  </div>
  
  <div class="tip-toast" id="toast">已复制到剪贴板</div>

  <script>
    const container = document.getElementById('container')
    const image = document.getElementById('image')
    const empty = document.getElementById('empty')
    const stage = document.getElementById('stage')
    const prev = document.getElementById('prev')
    const next = document.getElementById('next')
    const counter = document.getElementById('counter')
    const counterDivider = document.getElementById('counterDivider')
    const btnZoomIn = document.getElementById('btnZoomIn')
    const btnZoomOut = document.getElementById('btnZoomOut')
    const btnReset = document.getElementById('btnReset')
    const btnCopy = document.getElementById('btnCopy')
    const btnSave = document.getElementById('btnSave')
    const toast = document.getElementById('toast')

    const cache = new Map()
    let images = []
    let index = 0
    let currentResolvedUrl = ''

    // Transform state
    let scale = 1
    let panX = 0
    let panY = 0
    let isDragging = false
    let dragStartX = 0
    let dragStartY = 0
    let hasMoved = false

    function updateTransform() {
      container.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')'
      btnReset.textContent = Math.round(scale * 100) + '%'
      if (scale > 1) {
        container.style.cursor = isDragging ? 'grabbing' : 'grab'
        stage.style.cursor = 'default'
      } else {
        container.style.cursor = 'zoom-in'
        stage.style.cursor = 'zoom-out'
      }
    }

    function setZoom(nextScale, centerX, centerY) {
      const clamped = Math.max(0.2, Math.min(5, nextScale))
      if (clamped === 1) {
        panX = 0
        panY = 0
      }
      scale = clamped
      updateTransform()
    }

    function resetZoom() {
      scale = 1
      panX = 0
      panY = 0
      updateTransform()
    }

    function showToast(text) {
      toast.textContent = text
      toast.style.opacity = '1'
      setTimeout(() => { toast.style.opacity = '0' }, 1600)
    }

    function close() { window.astrorderPreview.close() }

    async function resolve(url) {
      if (cache.has(url)) return cache.get(url)
      const data = await window.astrorderPreview.resolve(url)
      cache.set(url, data)
      return data
    }

    async function show(nextIndex) {
      index = nextIndex
      resetZoom()
      const url = images[index]
      const hasMultiple = images.length > 1
      prev.hidden = next.hidden = !hasMultiple
      counter.hidden = counterDivider.hidden = !hasMultiple
      if (hasMultiple) {
        prev.disabled = index <= 0
        next.disabled = index >= images.length - 1
        counter.textContent = (index + 1) + ' / ' + images.length
      }
      image.hidden = true
      empty.hidden = true
      try {
        currentResolvedUrl = await resolve(url)
        image.src = currentResolvedUrl
        image.hidden = false
        const neighbor = images[index + 1] || images[index - 1]
        if (neighbor) void resolve(neighbor)
      } catch {
        empty.hidden = false
      }
    }

    // Stage click to close (when not dragged and not zoomed)
    stage.addEventListener('click', (e) => {
      if (hasMoved) return
      if (e.target === stage || e.target === container) {
        close()
      }
    })

    // Double click to toggle 1x and 2.5x
    image.addEventListener('dblclick', (e) => {
      e.stopPropagation()
      if (scale !== 1) resetZoom()
      else setZoom(2.5)
    })

    // Mouse wheel zoom
    window.addEventListener('wheel', (e) => {
      e.preventDefault()
      const factor = e.deltaY < 0 ? 1.15 : (1 / 1.15)
      setZoom(scale * factor)
    }, { passive: false })

    // Drag to pan
    container.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return
      isDragging = true
      hasMoved = false
      dragStartX = e.clientX - panX
      dragStartY = e.clientY - panY
      updateTransform()
    })

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return
      const dx = e.clientX - dragStartX
      const dy = e.clientY - dragStartY
      if (Math.abs(dx - panX) > 3 || Math.abs(dy - panY) > 3) {
        hasMoved = true
      }
      panX = dx
      panY = dy
      updateTransform()
    })

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false
        updateTransform()
      }
    })

    // Toolbar actions
    btnZoomIn.onclick = (e) => { e.stopPropagation(); setZoom(scale * 1.25) }
    btnZoomOut.onclick = (e) => { e.stopPropagation(); setZoom(scale / 1.25) }
    btnReset.onclick = (e) => { e.stopPropagation(); resetZoom() }

    btnCopy.onclick = async (e) => {
      e.stopPropagation()
      if (!currentResolvedUrl) return
      try {
        const ok = await window.astrorderPreview.copy(currentResolvedUrl)
        if (ok) showToast('已复制图片到剪贴板')
      } catch {}
    }

    btnSave.onclick = async (e) => {
      e.stopPropagation()
      if (!currentResolvedUrl) return
      try {
        await window.astrorderPreview.save(currentResolvedUrl)
      } catch {}
    }

    document.getElementById('close').onclick = (e) => { e.stopPropagation(); close() }
    prev.onclick = (e) => { e.stopPropagation(); if (index > 0) void show(index - 1) }
    next.onclick = (e) => { e.stopPropagation(); if (index < images.length - 1) void show(index + 1) }

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close()
      else if (e.key === 'ArrowLeft' && index > 0) void show(index - 1)
      else if (e.key === 'ArrowRight' && index < images.length - 1) void show(index + 1)
      else if (e.key === '=' || e.key === '+') setZoom(scale * 1.2)
      else if (e.key === '-') setZoom(scale / 1.2)
      else if (e.key === '0') resetZoom()
      else if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
        e.preventDefault()
        btnCopy.click()
      } else if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
        e.preventDefault()
        btnSave.click()
      }
    })

    window.astrorderPreview.onData((payload) => {
      images = payload.images || []
      void show(Math.max(0, Math.min(payload.index || 0, images.length - 1)))
    })
  </script>
</body>
</html>
