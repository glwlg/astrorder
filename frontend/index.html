<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1e28" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="星序" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script type="importmap">
      {
        "scopes": {
          "/api/v1/ext/": {
            "react": "/api/v1/ext/_sdk/react.js",
            "react/jsx-runtime": "/api/v1/ext/_sdk/jsx-runtime.js",
            "react-dom": "/api/v1/ext/_sdk/react-dom.js",
            "react-dom/client": "/api/v1/ext/_sdk/react-dom-client.js",
            "@mantine/core": "/api/v1/ext/_sdk/mantine-core.js",
            "@mantine/notifications": "/api/v1/ext/_sdk/mantine-notifications.js",
            "@astrorder/sdk": "/api/v1/ext/_sdk/sdk.js",
            "react-router-dom": "/api/v1/ext/_sdk/react-router-dom.js",
            "@tanstack/react-query": "/api/v1/ext/_sdk/react-query.js",
            "@astrorder/workspace-bridge": "/api/v1/ext/_sdk/workspace-bridge.js"
          }
        }
      }
    </script>
    <link rel="modulepreload" href="/src/main.tsx" />
    <title>星序 · Astrorder</title>
    <style id="astrorder-boot-splash">
      :root {
        --splash-bg: #11141b;
        --splash-fg: #e8ebf5;
        --splash-muted: #98a2b8;
        --splash-accent: #bc92ff;
        --splash-glow: rgba(188, 146, 255, 0.34);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --splash-bg: #f6f4fa;
          --splash-fg: #221d2d;
          --splash-muted: #6a637a;
          --splash-accent: #7540bd;
          --splash-glow: rgba(117, 64, 189, 0.24);
        }
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--splash-bg);
        color: var(--splash-fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      }
      #app-splash-root {
        position: fixed;
        inset: 0;
        padding-top: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle 500px at 50% 45%, var(--splash-glow), transparent 75%), var(--splash-bg);
        z-index: 99999;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .splash-orbit-box {
        position: relative;
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .splash-orbit-halo {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--splash-glow) 0%, transparent 70%);
        animation: splash-halo-pulse 2.4s ease-in-out infinite;
      }
      @keyframes splash-halo-pulse {
        0%, 100% { transform: scale(0.85); opacity: 0.3; }
        50% { transform: scale(1.25); opacity: 0.85; }
      }
      .splash-brand-mark {
        width: 56px;
        height: 56px;
        display: block;
        filter: drop-shadow(0 0 10px var(--splash-glow));
      }
      .splash-header-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin: 0 0 6px;
        color: var(--splash-fg);
      }
      .splash-header-sub {
        font-size: 12px;
        color: var(--splash-muted);
        letter-spacing: 0.04em;
        margin: 0 0 24px;
        opacity: 0.85;
      }
      .splash-bar-track {
        width: 140px;
        height: 2px;
        border-radius: 999px;
        background: rgba(128, 128, 128, 0.18);
        position: relative;
        overflow: hidden;
      }
      .splash-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--splash-accent), transparent);
        animation: splash-sweep 1.5s ease-in-out infinite;
      }
      @keyframes splash-sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-orbit-halo, .splash-bar-fill { animation: none; }
        .splash-bar-fill { width: 100%; }
      }
    </style>
    <script>
      try {
        var hexRe = /^#[0-9a-fA-F]{6}$/;
        var rawPalette = localStorage.getItem('astrorder:theme-palette');
        var p = rawPalette ? JSON.parse(rawPalette) : null;
        var primary = (p && hexRe.test(p.primary) ? p.primary : null) || localStorage.getItem('astrorder:theme-accent');
        var r = document.documentElement;
        if (primary && hexRe.test(primary)) {
          r.style.setProperty('--astr-theme-seed', primary);
          r.style.setProperty('--astr-theme-primary', primary);
          r.style.setProperty('--splash-accent', primary);
          r.style.setProperty('--splash-glow', 'color-mix(in oklab, ' + primary + ' 28%, transparent)');
          r.setAttribute('data-astr-theme-custom', 'true');
        }
        if (p && typeof p === 'object') {
          if (hexRe.test(p.secondary)) r.style.setProperty('--astr-theme-secondary', p.secondary);
          if (hexRe.test(p.highlight)) r.style.setProperty('--astr-theme-highlight', p.highlight);
          if (hexRe.test(p.surface)) r.style.setProperty('--astr-theme-surface', p.surface);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-splash-root" aria-label="正在加载星序工作台">
        <div class="splash-orbit-box">
          <div class="splash-orbit-halo"></div>
          <img class="splash-brand-mark" src="/logo.png" width="56" height="56" alt="" />
        </div>
        <div class="splash-header-title">星序 · Astrorder</div>
        <div class="splash-header-sub">群星各有所长，协作自有秩序</div>
        <div class="splash-bar-track">
          <div class="splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
