syntax = "proto3";

package astrorder.sessiond.v1;

option go_package = "astrorder.dev/contracts/gen/go/astrorder/sessiond/v1;sessiondv1";

// ContractLimit fixes compatibility and transport boundaries for every client.
enum ContractLimit {
  CONTRACT_LIMIT_UNSPECIFIED = 0;
  CONTRACT_LIMIT_MAX_COMPAT_BUSINESS_BYTES = 16000000;
  CONTRACT_LIMIT_MAX_GRPC_WIRE_BYTES = 33554432;
  CONTRACT_LIMIT_MAX_TERMINAL_INPUT_BYTES = 65536;
  CONTRACT_LIMIT_MAX_TERMINAL_CHUNK_BYTES = 262144;
}

enum CanonicalizationVersion {
  CANONICALIZATION_VERSION_UNSPECIFIED = 0;
  CANONICALIZATION_VERSION_LEGACY_JSON_V1 = 1;
  CANONICALIZATION_VERSION_ASTRORDER_OPERATION_V1 = 2;
}

enum EventStreamVersion {
  EVENT_STREAM_VERSION_UNSPECIFIED = 0;
  EVENT_STREAM_VERSION_V1 = 1;
}

enum NullValue {
  NULL_VALUE_UNSPECIFIED = 0;
  NULL_VALUE_NULL = 1;
}

enum RuntimeKind {
  RUNTIME_KIND_UNSPECIFIED = 0;
  RUNTIME_KIND_CODEX = 1;
  RUNTIME_KIND_PTY = 2;
  RUNTIME_KIND_HERMES = 3;
  RUNTIME_KIND_SSH_HERMES = 4;
  RUNTIME_KIND_CODEX_SSH = 5;
  RUNTIME_KIND_GROK = 6;
  RUNTIME_KIND_GROK_SSH = 7;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_IDLE = 1;
  SESSION_STATUS_RUNNING = 2;
  SESSION_STATUS_WAITING_APPROVAL = 3;
  SESSION_STATUS_ERROR = 4;
}

enum ObservedActiveStatus {
  OBSERVED_ACTIVE_STATUS_UNSPECIFIED = 0;
  OBSERVED_ACTIVE_STATUS_RUNNING = 1;
  OBSERVED_ACTIVE_STATUS_WAITING_APPROVAL = 2;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_MISSING = 1;
  OPERATION_STATE_PENDING = 2;
  OPERATION_STATE_UNCERTAIN = 3;
  OPERATION_STATE_COMPLETED = 4;
}

enum ErrorKind {
  ERROR_KIND_UNSPECIFIED = 0;
  ERROR_KIND_INVALID_ARGUMENT = 1;
  ERROR_KIND_UNAUTHENTICATED = 2;
  ERROR_KIND_PERMISSION_DENIED = 3;
  ERROR_KIND_NOT_FOUND = 4;
  ERROR_KIND_FAILED_PRECONDITION = 5;
  ERROR_KIND_RESOURCE_EXHAUSTED = 6;
  ERROR_KIND_UNAVAILABLE = 7;
  ERROR_KIND_DEADLINE = 8;
  ERROR_KIND_INTERNAL = 9;
  ERROR_KIND_CONFLICT = 10;
  ERROR_KIND_UNSUPPORTED = 11;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_ACCEPT = 1;
  APPROVAL_DECISION_DECLINE = 2;
  APPROVAL_DECISION_CANCEL = 3;
  APPROVAL_DECISION_ACCEPT_FOR_SESSION = 4;
}

enum ReviewDelivery {
  REVIEW_DELIVERY_UNSPECIFIED = 0;
  REVIEW_DELIVERY_INLINE = 1;
  REVIEW_DELIVERY_DETACHED = 2;
}

enum ResyncReason {
  RESYNC_REASON_UNSPECIFIED = 0;
  RESYNC_REASON_CURSOR_EXPIRED = 1;
  RESYNC_REASON_DAEMON_EPOCH_CHANGED = 2;
  RESYNC_REASON_UNKNOWN_SESSION = 3;
}

enum TerminalExitCause {
  TERMINAL_EXIT_CAUSE_UNSPECIFIED = 0;
  TERMINAL_EXIT_CAUSE_NATIVE_EXIT = 1;
  TERMINAL_EXIT_CAUSE_EXPLICIT_CLOSE = 2;
  TERMINAL_EXIT_CAUSE_TRANSPORT_FAILURE = 3;
}

enum ModelConfigTargetSupport {
  MODEL_CONFIG_TARGET_SUPPORT_UNSPECIFIED = 0;
  MODEL_CONFIG_TARGET_SUPPORT_IMPLEMENTED = 1;
  MODEL_CONFIG_TARGET_SUPPORT_UNSUPPORTED_UNTIL_GO_EXECUTOR = 2;
}

enum ManagedFile {
  MANAGED_FILE_UNSPECIFIED = 0;
  MANAGED_FILE_CODEX_CONFIG = 1;
  MANAGED_FILE_CODEX_CATALOG = 2;
  MANAGED_FILE_CODEX_MAGPIE_CATALOG = 3;
  MANAGED_FILE_GROK_CONFIG = 4;
  MANAGED_FILE_HERMES_CONFIG = 5;
}

enum ReloadAgent {
  RELOAD_AGENT_UNSPECIFIED = 0;
  RELOAD_AGENT_CODEX = 1;
  RELOAD_AGENT_GROK = 2;
  RELOAD_AGENT_HERMES = 3;
}

enum ConnectorAckState {
  CONNECTOR_ACK_STATE_UNSPECIFIED = 0;
  CONNECTOR_ACK_STATE_REGISTERED = 1;
  CONNECTOR_ACK_STATE_ACCEPTED = 2;
  CONNECTOR_ACK_STATE_REJECTED = 3;
  CONNECTOR_ACK_STATE_OVERFLOW = 4;
  CONNECTOR_ACK_STATE_DISCONNECTED = 5;
  CONNECTOR_ACK_STATE_HEARTBEAT = 6;
}

enum SshLogLevel {
  SSH_LOG_LEVEL_UNSPECIFIED = 0;
  SSH_LOG_LEVEL_QUIET = 1;
  SSH_LOG_LEVEL_FATAL = 2;
  SSH_LOG_LEVEL_ERROR = 3;
  SSH_LOG_LEVEL_INFO = 4;
  SSH_LOG_LEVEL_VERBOSE = 5;
  SSH_LOG_LEVEL_DEBUG = 6;
  SSH_LOG_LEVEL_DEBUG_1 = 7;
  SSH_LOG_LEVEL_DEBUG_2 = 8;
  SSH_LOG_LEVEL_DEBUG_3 = 9;
}

// NativeJson is exactly one UTF-8 JSON value. Consumers must validate it with
// json.Decoder.UseNumber (or an equivalent lossless decoder) before use.
message NativeJson {
  string schema = 1;
  bytes utf8_json = 2;
  optional string hash = 3;
  optional string sha256 = 4;
}

message NullableString {
  oneof state {
    string value = 1;
    NullValue null = 2;
  }
}

message PresenceFixture {
  optional string optional_text = 1;
  optional uint32 optional_count = 2;
  optional bool enabled = 3;
  NullableString nullable_text = 4;
}

// InteropFixture exists only to verify the transitional Go/Python wire boundary.
// It is not part of a service request or response.
message InteropFixture {
  PresenceFixture present = 1;
  PresenceFixture absent = 2;
  int64 signed_above_javascript = 3;
  uint64 unsigned_value = 4;
  NativeJson native = 5;
  TerminalOutput terminal = 6;
}

message ExactIdentifier {
  oneof value {
    string text = 1;
    sint64 signed = 2;
    uint64 unsigned = 3;
    string decimal = 4;
    bytes native_json = 5;
  }
}

message SshOptions {
  optional bool batch_mode = 1;
  optional uint32 connect_timeout_secs = 2;
  optional uint32 server_alive_interval_secs = 3;
  optional uint32 server_alive_count_max = 4;
  optional bool tcp_keep_alive = 5;
  optional bool compression = 6;
  optional SshLogLevel log_level = 7;
}

// SshConnectConfig carries validated connection settings and file references.
// It never carries key material or other secret contents.
message SshConnectConfig {
  string host = 1;
  uint32 port = 2;
  optional string user = 3;
  optional string ssh_config_alias = 4;
  optional string identity_file = 5;
  optional string workspace = 6;
  optional string hermes_executable = 7;
  optional string codex_executable = 8;
  optional string grok_executable = 9;
  SshOptions options = 10;
  optional string profile_name = 12;
  optional string display_name = 13;
  optional string hermes_path = 14;
  optional string ssh_executable = 15;
}

message RuntimeTarget {
  RuntimeKind runtime = 1;
  optional string agent_id = 2;
  optional string connection_id = 3;
  optional SshConnectConfig ssh = 4;
}

message SessionRef {
  string session_id = 1;
  optional string agent_id = 2;
  optional string connection_id = 3;
}

message CommandMeta {
  string operation_id = 1;
  optional string command_id = 2;
  optional string trace_id = 3;
  CanonicalizationVersion canonicalization = 4;
}

message BusinessError {
  ErrorKind kind = 1;
  string message = 2;
  optional string native_code = 3;
  bool retryable = 4;
  optional NativeJson details = 5;
}

message NullableSessionStatus {
  oneof state {
    SessionStatus value = 1;
    NullValue null = 2;
  }
}

message NullableBusinessError {
  oneof state {
    BusinessError value = 1;
    NullValue null = 2;
  }
}

message CommandResult {
  bool accepted = 1;
  bool termination_confirmed = 2;
  optional string turn_id = 3;
  optional string title = 4;
  optional string model = 5;
  optional string provider = 6;
  optional string effort = 7;
  optional NativeJson native = 8;
}

message CommandReceipt {
  string daemon_id = 1;
  string operation_id = 2;
  OperationState operation_state = 3;
  SessionRef session = 4;
  SessionStatus status = 5;
  bool accepted = 6;
  optional string turn_id = 7;
  oneof outcome {
    CommandResult completed = 8;
    BusinessError uncertain = 9;
    BusinessError rejected = 10;
  }
}

message SessionReceipt {
  string daemon_id = 1;
  SessionRef session = 2;
  SessionStatus status = 3;
  bool attached = 4;
  optional NativeJson native = 5;
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string daemon_id = 3;
  repeated string services = 4;
  repeated CanonicalizationVersion canonicalization_versions = 5;
  ContractLimit max_business_bytes = 6;
  ContractLimit max_wire_bytes = 7;
  EventStreamVersion event_stream_version = 8;
  bool operation_lookup = 9;
}

message GetStatusRequest {}

message RuntimeStatus {
  RuntimeKind runtime = 1;
  bool registered = 2;
  uint32 owned_sessions = 3;
  bool busy = 4;
  optional BusinessError health_error = 5;
}

message SessionSnapshot {
  SessionRef session = 1;
  SessionStatus status = 2;
  int64 min_seq_id = 3;
  int64 replay_through_seq_id = 4;
  optional NativeJson native = 5;
  // runtime_owned is the authoritative live-ownership verdict for this
  // session: true means the session is currently bound to a live runtime in
  // this daemon's registry (with the runtime kind and SessionRef identity
  // below). Journal-only rows (a durable session whose native owner was
  // released) report false or omit the field. Older daemons that do not set
  // this field leave ownership unknown; clients must not treat absence as a
  // live attachment.
  optional bool runtime_owned = 6;
  // runtime is the owning runtime kind for a live-owned session. It is only
  // set when runtime_owned is true; a journal-only row never borrows another
  // session's or another connection's kind.
  optional RuntimeKind runtime = 7;
}

message GetStatusResponse {
  string daemon_id = 1;
  repeated RuntimeStatus runtimes = 2;
  repeated SessionSnapshot sessions = 3;
  repeated string connector_ids = 4;
  optional uint64 pending_operations = 5;
  optional BusinessError storage_error = 6;
  optional BusinessError model_config_error = 7;
}

message ShutdownRequest {
  bool confirm_active = 1;
  optional string expected_daemon_id = 2;
}

message ShutdownResponse {
  string daemon_id = 1;
  bool accepted = 2;
  bool graceful_drain_started = 3;
}

message CodexCreateOptions {
  string cwd = 1;
  optional string parent_session_id = 2;
  optional string model = 3;
  optional string provider = 4;
  optional string effort = 5;
  optional NativeJson native_options = 6;
}

message HermesCreateOptions {
  optional string parent_session_id = 1;
  optional string model = 2;
  optional string provider = 3;
  optional string effort = 4;
  optional NativeJson native_options = 5;
}

message GrokCreateOptions {
  string cwd = 1;
  optional string model = 2;
  optional string effort = 3;
  optional NativeJson native_options = 4;
}

message CreateSessionRequest {
  CommandMeta meta = 1;
  RuntimeTarget target = 2;
  oneof options {
    CodexCreateOptions codex = 10;
    HermesCreateOptions hermes = 11;
    GrokCreateOptions grok = 12;
  }
}

message AttachSessionRequest {
  SessionRef session = 1;
  RuntimeTarget target = 2;
  optional string cwd = 3;
  bool runtime_control = 4;
  optional NativeJson native_options = 5;
}

message TextInput {
  string text = 1;
}

message ImageUrlInput {
  string url = 1;
}

message LocalImageInput {
  string path = 1;
}

message SkillRefInput {
  string name = 1;
  string path = 2;
}

message MentionRefInput {
  string name = 1;
  string path = 2;
}

message AttachmentInput {
  string name = 1;
  string media_type = 2;
  bytes content = 3;
  optional string source_id = 4;
}

message InputPart {
  oneof part {
    TextInput text = 1;
    ImageUrlInput image_url = 2;
    LocalImageInput local_image = 3;
    SkillRefInput skill = 4;
    MentionRefInput mention = 5;
    AttachmentInput attachment = 6;
  }
}

message SendPolicy {
  optional string model = 1;
  optional string approval_policy = 2;
  optional string sandbox_policy = 3;
  optional string approvals_reviewer = 4;
  optional NativeJson native_options = 5;
}

message SendRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  repeated InputPart input = 3;
  SendPolicy policy = 4;
}

message SteerRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  string turn_id = 3;
  repeated InputPart input = 4;
}

message ReviewTarget {
  oneof target {
    string branch = 1;
    string commit = 2;
    string uncommitted = 3;
    NativeJson native = 4;
  }
}

message StartReviewRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  ReviewTarget target = 3;
  ReviewDelivery delivery = 4;
  optional string instructions = 5;
  optional string model = 6;
}

message CompactRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  optional string instructions = 3;
  optional string model = 4;
}

message InterruptRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  optional string turn_id = 3;
}

message PermissionGrant {
  string name = 1;
  optional string scope = 2;
  optional NativeJson native = 3;
}

message RespondApprovalRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  ExactIdentifier approval_id = 3;
  ApprovalDecision decision = 4;
  repeated PermissionGrant permissions = 5;
  // Explicit response to a native request_user_input, never an approval grant.
  optional NativeJson user_input = 6;
}

message UpdateSettingsRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  optional string model = 3;
  optional string provider = 4;
  optional string effort = 5;
}

message RenameSessionRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  string title = 3;
}

message DeleteSessionRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
}

message CloseSessionRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
}

message DetachSessionRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  bool keep_runtime = 3;
}

// ReportObservedStatus accepts only a positive owned-session observation.
// Absence from a native active list is never represented as an idle report.
message ReportObservedStatusRequest {
  SessionRef session = 1;
  ObservedActiveStatus observed_active_status = 2;
  string observer = 3;
  int64 observed_at_unix_micros = 4;
}

message DesktopTextInput {
  string text = 1;
}

message DesktopImageInput {
  string url = 1;
}

message DesktopInputPart {
  oneof part {
    DesktopTextInput text = 1;
    DesktopImageInput image = 2;
  }
}

message SubmitDesktopRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  repeated DesktopInputPart input = 3;
}

message UpdateDesktopSettingsRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  optional string model = 3;
  optional string model_label = 4;
  optional string effort = 5;
  optional uint32 effort_index = 6;
}

message EmptyNativeQuery {
  optional NativeJson options = 1;
}

message CodexInitializeQuery {
  optional NativeJson options = 1;
}

message CodexAccountReadQuery {
  optional NativeJson options = 1;
}

message CodexHooksListQuery {
  optional NativeJson options = 1;
}

message CodexModelListQuery {
  optional uint32 limit = 1;
  optional NullableString cursor = 2;
  optional bool include_hidden = 3;
  optional NativeJson options = 4;
}

