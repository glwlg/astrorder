}

message CodexThreadLoadedListQuery {
  optional NativeJson options = 1;
}

message CodexThreadReadQuery {
  string thread_id = 1;
  optional bool include_turns = 2;
  optional NativeJson options = 3;
}

message HermesSessionListQuery {
  optional uint32 offset = 1;
  optional uint32 limit = 2;
  optional string source_id = 3;
  optional NativeJson options = 4;
}

message HermesActiveListQuery {
  optional NativeJson options = 1;
}

message HermesProjectsTreeQuery {
  optional NativeJson options = 1;
}

message HermesProjectSessionsQuery {
  string project_id = 1;
  optional uint32 session_limit = 2;
  optional NativeJson options = 3;
}

message HermesSessionHistoryQuery {
  string session_id = 1;
  optional NullableString before = 2;
  optional uint32 limit = 3;
  optional NativeJson options = 4;
}

message HermesModelsListQuery {
  optional NativeJson options = 1;
}

message HermesCommandsListQuery {
  optional NativeJson options = 1;
}

message GrokInitializeQuery {
  optional NativeJson options = 1;
}

message NativeQueryRequest {
  RuntimeTarget target = 1;
  // Preserves native payload/hash/sha256 fields that exist outside request params.
  optional NativeJson top_level_payload = 2;
  optional string top_level_hash = 3;
  optional string top_level_sha256 = 4;
  oneof query {
    CodexInitializeQuery codex_initialize = 10;
    CodexAccountReadQuery codex_account_read = 11;
    CodexHooksListQuery codex_hooks_list = 12;
    CodexModelListQuery codex_model_list = 13;
    CodexSkillsListQuery codex_skills_list = 14;
    CodexThreadItemsListQuery codex_thread_items_list = 15;
    CodexThreadListQuery codex_thread_list = 16;
    CodexThreadLoadedListQuery codex_thread_loaded_list = 17;
    CodexThreadReadQuery codex_thread_read = 18;
    HermesSessionListQuery hermes_session_list = 30;
    HermesActiveListQuery hermes_active_list = 31;
    HermesProjectsTreeQuery hermes_projects_tree = 32;
    HermesProjectSessionsQuery hermes_project_sessions = 33;
    HermesSessionHistoryQuery hermes_session_history = 34;
    HermesModelsListQuery hermes_models_list = 35;
    HermesCommandsListQuery hermes_commands_list = 36;
    GrokInitializeQuery grok_initialize = 50;
  }
}

message NativeQueryResponse {
  RuntimeTarget target = 1;
  NativeJson result = 2;
}

message HistoryPageRequest {
  SessionRef session = 1;
  optional NullableString before = 2;
  uint32 limit = 3;
}

message HistoryPageResponse {
  SessionRef session = 1;
  repeated NativeJson items = 2;
  optional NullableString next_cursor = 3;
  optional bool has_more = 4;
  optional NativeJson native = 5;
}

message ListBackgroundProcessesRequest {
