  optional string description = 2;
  optional string input_hint = 3;
  optional NativeJson native = 4;
}

message ListCommandsResponse {
  repeated CommandOption items = 1;
}

message ReadModelRequest {
  SessionRef session = 1;
}

message ModelState {
  SessionRef session = 1;
  optional string provider = 2;
  optional string model = 3;
  optional string branch = 4;
  optional string effort = 5;
  optional NativeJson native = 6;
}

message SetModelRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  string provider = 3;
  string model = 4;
}

message SetReasoningRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  string effort = 3;
}

message ReadApprovalModeRequest {
  SessionRef session = 1;
}

message SetGoalRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  string objective = 3;
  // Empty edits the objective; paused/active changes only native lifecycle state.
  string status = 4;
}

message ClearGoalRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
}

message ApprovalModeState {
  SessionRef session = 1;
  string mode = 2;
  optional string raw_unknown = 3;
}

message SetApprovalModeRequest {
  CommandMeta meta = 1;
  SessionRef session = 2;
  string mode = 3;
}

message DisconnectRuntimeRequest {
  CommandMeta meta = 1;
  RuntimeTarget target = 2;
  bool confirm_active = 3;
}

message DisconnectRuntimeResponse {
  string daemon_id = 1;
  bool disconnected = 2;
  repeated string released_session_ids = 3;
  OperationState operation_state = 4;
  optional BusinessError error = 5;
}

message SessionCursor {
  SessionRef session = 1;
  int64 after_seq_id = 2;
}

message SubscribeRequest {
  optional string expected_daemon_id = 1;
  repeated SessionCursor cursors = 2;
  uint32 replay_page_size = 3;
  bool include_snapshot = 4;
}

message RuntimeOwnerEvent {
  optional int64 owner_pid = 1;
  optional string runtime_id = 2;
}

message OwnershipLostEvent {
  bool adopted = 1;
  SessionStatus previous_status = 2;
  bool orphan_alive = 3;
  string reason = 4;
}

message PtyOutputEvent {
  bytes data = 1;
  int64 chunk_seq = 2;
}

message ConnectorEventPayload {
  string agent_id = 1;
  string event_type = 2;
  optional NativeJson data = 3;
}

message EventEnvelope {
  string daemon_id = 1;
  SessionRef session = 2;
  int64 seq_id = 3;
  int64 timestamp_unix_micros = 4;
  string event_type = 5;
  SessionStatus status = 6;
  // Complete persisted payload, including unknown fields and exact integers.
  // Coexists with the typed projection; neither projection may erase it.
  optional NativeJson native_payload = 7;
  oneof payload {
    RuntimeOwnerEvent runtime_owner = 10;
    OwnershipLostEvent ownership_lost = 11;
    PtyOutputEvent pty_output = 12;
    ConnectorEventPayload connector = 13;
    NativeJson native = 30;
  }
}

message StateSnapshot {
  string daemon_id = 1;
  repeated SessionSnapshot sessions = 2;
}

message SessionWatermark {
  SessionRef session = 1;
  int64 replay_through_seq_id = 2;
}

message LiveReady {
  string daemon_id = 1;
  repeated SessionWatermark watermarks = 2;
}

message ResyncRequired {
  SessionRef session = 1;
  int64 requested_after_seq_id = 2;
  int64 min_retained_seq_id = 3;
  int64 committed_through_seq_id = 4;
  ResyncReason reason = 5;
  optional string current_daemon_id = 6;
}

message StreamOverflow {
  repeated SessionCursor last_emitted = 1;
  uint32 queue_capacity = 2;
  string reason = 3;
}

message EventStreamFrame {
  oneof frame {
    StateSnapshot snapshot = 1;
    EventEnvelope replay = 2;
    LiveReady live_ready = 3;
    EventEnvelope live = 4;
    ResyncRequired resync_required = 5;
    StreamOverflow overflow = 6;
  }
}

message AppendEventRequest {
  SessionRef session = 1;
  string event_type = 2;
  SessionStatus status = 3;
  NativeJson payload = 4;
  optional int64 timestamp_unix_micros = 5;
  optional string payload_hash = 6;
}

message AppendEventResponse {
  string daemon_id = 1;
  SessionRef session = 2;
  int64 seq_id = 3;
}

message OpenTerminal {
  RuntimeTarget target = 1;
  SessionRef session = 2;
  string cwd = 3;
  optional string executable = 4;
  repeated string args = 5;
  uint32 cols = 6;
  uint32 rows = 7;
}

message TerminalInput {
  bytes data = 1;
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalInterrupt {}

message TerminalClose {
  string reason = 1;
}

message TerminalClientFrame {
  string terminal_stream_id = 1;
  int64 reconnect_after_chunk_seq = 2;
  oneof frame {
    OpenTerminal open = 10;
    TerminalInput input = 11;
    TerminalResize resize = 12;
    TerminalInterrupt interrupt = 13;
    TerminalClose close = 14;
  }
}

message TerminalOpened {
  SessionRef session = 1;
  int64 replay_through_chunk_seq = 2;
}

message TerminalOutput {
  bytes data = 1;
  int64 chunk_seq = 2;
  bool replay = 3;
}

message TerminalExit {
  optional int32 exit_code = 1;
  TerminalExitCause cause = 2;
  bool remote_exit_confirmed = 3;
}

message TerminalOverflow {
  int64 last_emitted_chunk_seq = 1;
  uint32 queue_capacity = 2;
}

message TerminalServerFrame {
  string terminal_stream_id = 1;
  oneof frame {
    TerminalOpened opened = 2;
    TerminalOutput output = 3;
    TerminalExit exit = 4;
    TerminalOverflow overflow = 5;
    BusinessError error = 6;
  }
}

message OperationKey {
  string operation_id = 1;
  string legacy_action = 2;
  NullableString agent_type_compat = 3;
  NullableString connection_id = 4;
  NullableString session_id = 5;
  CanonicalizationVersion canonicalization = 6;
}

message GetOperationRequest {
  OperationKey key = 1;
}

message OperationReceipt {
  string daemon_id = 1;
  OperationKey key = 2;
  OperationState state = 3;
  optional bytes request_sha256 = 4;
  optional CommandReceipt typed_response = 5;
  optional bytes legacy_response_json = 6;
  NullableBusinessError error = 7;
  NullableSessionStatus status = 8;
}

message LocalTarget {}

message WslTarget {
  string distro = 1;
}

message SshTarget {
  string connection_id = 1;
  SshConnectConfig config = 2;
}

message ModelConfigTarget {
  oneof target {
    LocalTarget local = 1;
    WslTarget wsl = 2;
    SshTarget ssh = 3;
  }
}

message ModelConfigFileInput {
  ManagedFile file = 1;
  bytes content = 2;
  optional string expected_sha256 = 3;
}

message SensitiveEnvironmentValue {
  string name = 1;
  bytes value = 2;
}

message ModelConfigPlanRequest {
  ModelConfigTarget target = 1;
  repeated ModelConfigFileInput proposed_files = 2;
  repeated string expected_agents = 3;
}

message ModelConfigFileState {
  ManagedFile file = 1;
  bool exists = 2;
  string sha256 = 3;
  bytes content = 4;
  string status = 5;
  bool valid = 6;
}

message ModelConfigChange {
  ManagedFile file = 1;
  bool changed = 2;
  string current_sha256 = 3;
  string expected_sha256 = 4;
  optional string status = 5;
}

message ModelConfigPlanResponse {
  ModelConfigTarget target = 1;
  ModelConfigTargetSupport target_support = 2;
  repeated ModelConfigFileState current_files = 3;
  repeated ModelConfigChange changes = 4;
  optional string home = 5;
  optional BusinessError error = 6;
}

message ModelConfigApplyRequest {
  CommandMeta meta = 1;
  ModelConfigTarget target = 2;
  repeated ModelConfigFileInput files = 3;
  repeated SensitiveEnvironmentValue environment_values = 4;
}

message FileDigest {
  ManagedFile file = 1;
  string sha256 = 2;
}

message ModelConfigApplyResponse {
  string daemon_id = 1;
  string operation_id = 2;
  OperationState operation_state = 3;
  ModelConfigTargetSupport target_support = 4;
  repeated ManagedFile changed = 5;
  repeated FileDigest digests = 6;
  optional BusinessError error = 7;
}

message ModelConfigReloadRequest {
  CommandMeta meta = 1;
  repeated ReloadAgent agents = 2;
}

message ModelConfigReloadResponse {
  string daemon_id = 1;
  string operation_id = 2;
  OperationState operation_state = 3;
  repeated ReloadAgent reloaded = 4;
  repeated ReloadAgent pending = 5;
  bool deferred = 6;
  string status = 7;
  optional BusinessError error = 8;
}

message ConnectorAgent {
  string id = 1;
  string kind = 2;
  string name = 3;
  string status = 4;
  repeated string capabilities = 5;
  optional string source_id = 6;
  optional string runtime_id = 7;
  optional string connection_id = 8;
  optional NativeJson native = 9;
}

message ConnectorHello {
  uint32 protocol_version = 1;
  ConnectorAgent agent = 2;
}

message ConnectorHeartbeat {
  int64 sent_at_unix_micros = 1;
}

message ConnectorEvent {
  string event_id = 1;
  string event_type = 2;
  string agent_id = 3;
  optional string session_id = 4;
  optional SessionStatus status = 5;
  NativeJson data = 6;
  optional string payload_hash = 7;
}

message ConnectorDisconnect {
  string reason = 1;
}

message ConnectorIngressFrame {
  oneof frame {
    ConnectorHello hello = 1;
    ConnectorHeartbeat heartbeat = 2;
    ConnectorEvent event = 3;
    ConnectorDisconnect disconnect = 4;
  }
}

message ConnectorRegistered {
  string agent_id = 1;
}

message ConnectorEventAccepted {
  string event_id = 1;
  optional string committed_session_id = 2;
  optional int64 committed_seq_id = 3;
}

message ConnectorRejected {
  optional string event_id = 1;
  BusinessError error = 2;
}

message ConnectorOverflow {
  uint32 queue_capacity = 1;
  optional string last_accepted_event_id = 2;
}

message ConnectorDisconnected {
  string agent_id = 1;
  string reason = 2;
}

message ConnectorHeartbeatAck {
  int64 received_at_unix_micros = 1;
}

message ConnectorIngressAck {
  ConnectorAckState state = 1;
  oneof ack {
    ConnectorRegistered registered = 2;
    ConnectorEventAccepted event_accepted = 3;
    ConnectorRejected rejected = 4;
    ConnectorOverflow overflow = 5;
    ConnectorDisconnected disconnected = 6;
    ConnectorHeartbeatAck heartbeat = 7;
  }
}

message BindControlSessionRequest {
  string agent_id = 1;
  SessionRef control_session = 2;
}

message BindControlSessionResponse {
  bool bound = 1;
  uint32 flushed_events = 2;
}

message DisconnectConnectorRequest {
  CommandMeta meta = 1;
  string agent_id = 2;
  bool confirm_active = 3;
}

message DisconnectConnectorResponse {
  string daemon_id = 1;
  bool disconnected = 2;
  OperationState operation_state = 3;
  optional BusinessError error = 4;
}

service DaemonControl {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

service SessionControl {
  rpc CreateSession(CreateSessionRequest) returns (CommandReceipt);
  rpc AttachSession(AttachSessionRequest) returns (SessionReceipt);
  rpc Send(SendRequest) returns (CommandReceipt);
  rpc Steer(SteerRequest) returns (CommandReceipt);
  rpc StartReview(StartReviewRequest) returns (CommandReceipt);
  rpc Compact(CompactRequest) returns (CommandReceipt);
  rpc Interrupt(InterruptRequest) returns (CommandReceipt);
  rpc RespondApproval(RespondApprovalRequest) returns (CommandReceipt);
  rpc UpdateSettings(UpdateSettingsRequest) returns (CommandReceipt);
  rpc RenameSession(RenameSessionRequest) returns (CommandReceipt);
  rpc DeleteSession(DeleteSessionRequest) returns (CommandReceipt);
  rpc CloseSession(CloseSessionRequest) returns (CommandReceipt);
  rpc DetachSession(DetachSessionRequest) returns (CommandReceipt);
  rpc ReportObservedStatus(ReportObservedStatusRequest) returns (SessionReceipt);
  rpc SubmitDesktop(SubmitDesktopRequest) returns (CommandReceipt);
  rpc UpdateDesktopSettings(UpdateDesktopSettingsRequest) returns (CommandReceipt);
}

service RuntimeQuery {
  rpc QueryNative(NativeQueryRequest) returns (NativeQueryResponse);
  rpc GetHistoryPage(HistoryPageRequest) returns (HistoryPageResponse);
  rpc ListBackgroundProcesses(ListBackgroundProcessesRequest) returns (ListBackgroundProcessesResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  rpc ReadModel(ReadModelRequest) returns (ModelState);
  rpc SetModel(SetModelRequest) returns (CommandReceipt);
  rpc SetReasoning(SetReasoningRequest) returns (CommandReceipt);
  rpc SetGoal(SetGoalRequest) returns (CommandReceipt);
  rpc ClearGoal(ClearGoalRequest) returns (CommandReceipt);
  rpc ReadApprovalMode(ReadApprovalModeRequest) returns (ApprovalModeState);
  rpc SetApprovalMode(SetApprovalModeRequest) returns (CommandReceipt);
  rpc DisconnectRuntime(DisconnectRuntimeRequest) returns (DisconnectRuntimeResponse);
}

service EventStream {
  rpc Subscribe(SubscribeRequest) returns (stream EventStreamFrame);
  rpc AppendEvent(AppendEventRequest) returns (AppendEventResponse);
}

service TerminalStream {
  rpc Open(stream TerminalClientFrame) returns (stream TerminalServerFrame);
}

service OperationQuery {
  rpc GetOperation(GetOperationRequest) returns (OperationReceipt);
}

service ModelConfig {
  rpc Plan(ModelConfigPlanRequest) returns (ModelConfigPlanResponse);
  rpc Apply(ModelConfigApplyRequest) returns (ModelConfigApplyResponse);
  rpc Reload(ModelConfigReloadRequest) returns (ModelConfigReloadResponse);
}

service ConnectorIngress {
  rpc Connect(stream ConnectorIngressFrame) returns (stream ConnectorIngressAck);
  rpc BindControlSession(BindControlSessionRequest) returns (BindControlSessionResponse);
  rpc DisconnectConnector(DisconnectConnectorRequest) returns (DisconnectConnectorResponse);
}
