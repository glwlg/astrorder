}

message ListBackgroundProcessesResponse {
  repeated NativeJson processes = 1;
}

message ListModelsRequest {
  SessionRef session = 1;
}

message ModelOption {
  string provider = 1;
  string model = 2;
  optional string label = 3;
  repeated string supported_efforts = 4;
  optional NativeJson native = 5;
}

message ListModelsResponse {
