version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # The migration design freezes these concise service names and deliberately
    # reuses typed receipts/stream frames across operations.
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
