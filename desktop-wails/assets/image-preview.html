<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>图片预览</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0c0d10;color:#fff;overflow:hidden;font:14px "Segoe UI",sans-serif}#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}img{max-width:90vw;max-height:85vh;object-fit:contain;user-select:none}button{background:#292d38;color:#fff;border:0;border-radius:8px;padding:10px;cursor:pointer}button:disabled{opacity:.4}#close{position:absolute;right:16px;top:16px}#tools{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap}#error{position:absolute;top:20px;left:20px;color:#fca5a5}
</style>
<div id="stage"><img id="image" draggable="false" alt="图片预览"></div><button id="close" aria-label="关闭预览">关闭 (Esc)</button>
<div id="tools"><button id="prev">上一张</button><span id="count"></span><button id="next">下一张</button><button id="out">−</button><button id="reset">100%</button><button id="in">＋</button><button id="copy">复制图片</button><button id="save">保存图片</button></div><div id="error" role="status"></div>
<script type="module">
import * as svc from '/bindings/astrorder.dev/desktop/previewservice.js';
let images=[],index=0,scale=1,x=0,y=0,drag=null;
const image=document.getElementById('image'),error=document.getElementById('error');
function transform(){image.style.transform=`translate(${x}px,${y}px) scale(${scale})`;document.getElementById('reset').textContent=Math.round(scale*100)+'%'}
function zoom(value){scale=Math.max(.2,Math.min(5,value));if(scale===1)x=y=0;transform()}
function show(n){index=n;x=y=0;zoom(1);image.src=images[index]||'';document.getElementById('count').textContent=`${index+1} / ${images.length}`;document.getElementById('prev').disabled=index<=0;document.getElementById('next').disabled=index>=images.length-1;error.textContent=''}
async function load(){try{const data=await svc.Data();images=data.images;show(data.index)}catch(e){error.textContent=e.message}}
const close=()=>svc.Close();
document.getElementById('close').onclick=close;
document.getElementById('prev').onclick=()=>{if(index>0)show(index-1)};
document.getElementById('next').onclick=()=>{if(index<images.length-1)show(index+1)};
document.getElementById('in').onclick=()=>zoom(scale*1.25);
document.getElementById('out').onclick=()=>zoom(scale/1.25);
document.getElementById('reset').onclick=()=>zoom(1);
async function action(kind){try{const ok=await svc[kind](index);error.textContent=ok?(kind==='Copy'?'已复制图片':'已保存图片'):''}catch(e){error.textContent=e.message}}
document.getElementById('copy').onclick=()=>action('Copy');document.getElementById('save').onclick=()=>action('Save');
window.addEventListener('preview-update',load);window.addEventListener('wheel',e=>{e.preventDefault();zoom(scale*(e.deltaY<0?1.15:1/1.15))},{passive:false});
image.ondblclick=()=>zoom(scale===1?2.5:1);
image.onpointerdown=e=>{drag={x:e.clientX-x,y:e.clientY-y};image.setPointerCapture(e.pointerId)};
image.onpointermove=e=>{if(drag){x=e.clientX-drag.x;y=e.clientY-drag.y;transform()}};image.onpointerup=()=>{drag=null};image.onpointercancel=()=>{drag=null};
window.addEventListener('keydown',e=>{if(e.key==='Escape')void close();else if(e.key==='ArrowLeft'&&index>0)show(index-1);else if(e.key==='ArrowRight'&&index<images.length-1)show(index+1);else if(e.key==='+'||e.key==='=')zoom(scale*1.25);else if(e.key==='-')zoom(scale/1.25);else if(e.key==='0')zoom(1);else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){e.preventDefault();void action('Copy')}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();void action('Save')}});
void load();
</script></html>
