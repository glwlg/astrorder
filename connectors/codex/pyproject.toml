[project]
name = "astrorder-codex-connector"
version = "0.1.0"
description = "Codex app-server companion for the Astrorder control channel"
requires-python = ">=3.11"
dependencies = ["websockets>=13"]

[project.scripts]
astrorder-codex-connector = "astrorder_codex_connector:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astrorder_codex_connector"]
