[project]
name = "astrorder-server"
version = "0.1.0"
description = "星序 · Astrorder independent Agent control server"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy", "pydantic-settings", "aiosqlite", "python-multipart", "httpx", "websockets", "astrorder-codex-connector"]

[tool.uv.sources]
astrorder-codex-connector = { path = "../connectors/codex", editable = true }

[project.scripts]
astrorder-server = "astrorder.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrorder"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
