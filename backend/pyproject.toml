[project]
name = "astrorder-server"
version = "0.1.0"
description = "星序 · Astrorder independent Agent control server"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic-settings",
    "aiosqlite",
    "python-multipart",
    "httpx",
    "websockets",
    "astrorder-codex-connector",
    "pywinpty>=3.0.5",
    "pywin32>=311; sys_platform == 'win32'",
    "browser-harness==0.1.13",
    "jev-ultrafast",
]

[tool.uv.sources]
astrorder-codex-connector = { path = "../connectors/codex", editable = true }
jev-ultrafast = { git = "https://github.com/browser-use/jev-ultrafast", rev = "1231850a0bf1a0c0341fe408ef1668dbbfdfac46" }

[project.scripts]
astrorder-server = "astrorder.__main__:main"
astrorder-agent = "astrorder.agent_cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrorder"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
