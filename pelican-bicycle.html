<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车 - 2D SVG 动画</title>
  <style>
    :root {
      --bg-top: #0f172a;
      --bg-bottom: #1e293b;
      --panel-bg: rgba(15, 23, 42, 0.78);
      --panel-border: rgba(255, 255, 255, 0.14);
      --accent: #f59e0b;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #090d16 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      padding: 16px;
      overflow-x: hidden;
    }

    .stage-wrap {
      width: min(1000px, 96vw);
      aspect-ratio: 16 / 10;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.12);
      background: #87ceeb;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 18px;
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      font-size: 13px;
    }

    .hud label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #e2e8f0;
    }

    .hud input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
      width: 110px;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(245, 158, 11, 0.25);
      border-color: #f59e0b;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.active {
      background: #f59e0b;
      color: #0f172a;
      border-color: #f59e0b;
    }
  </style>
</head>
<body>

  <div class="stage-wrap">
    <svg id="scene" viewBox="0 0 960 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Sky Gradients -->
        <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="55%" stop-color="#bae6fd" />
          <stop offset="100%" stop-color="#fef9c3" />
        </linearGradient>
        <linearGradient id="skySunset" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1e1b4b" />
          <stop offset="35%" stop-color="#7c2d12" />
          <stop offset="70%" stop-color="#f97316" />
          <stop offset="100%" stop-color="#fde047" />
        </linearGradient>

        <!-- Ocean Gradient -->
        <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0284c7" />
          <stop offset="100%" stop-color="#0369a1" />
        </linearGradient>

        <!-- Sun Glow -->
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
          <stop offset="45%" stop-color="#facc15" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
        </radialGradient>

        <!-- Pelican Body & Beak Gradients -->
        <linearGradient id="pelicanBody" x1="0" y1="0" x2="0.3" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="65%" stop-color="#f8fafc" />
          <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>

        <linearGradient id="pelicanWing" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="60%" stop-color="#e2e8f0" />
          <stop offset="100%" stop-color="#94a3b8" />
        </linearGradient>

        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fb923c" />
          <stop offset="50%" stop-color="#f97316" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <linearGradient id="upperBeakGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#fde047" />
          <stop offset="75%" stop-color="#f59e0b" />
          <stop offset="100%" stop-color="#dc2626" />
        </linearGradient>

        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ef4444" />
          <stop offset="50%" stop-color="#dc2626" />
          <stop offset="100%" stop-color="#991b1b" />
        </linearGradient>

        <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="50%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#475569" />
        </linearGradient>

        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#334155" />
          <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>

        <!-- Drop Shadow -->
        <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
        </filter>
      </defs>

      <!-- 1. SKY & SUN -->
      <rect id="skyRect" x="0" y="0" width="960" height="440" fill="url(#skyDay)" />

      <g id="sunGroup" transform="translate(770, 115)">
        <circle r="88" fill="url(#sunGlow)" />
        <circle r="42" fill="#fef08a" />
      </g>

      <!-- 2. CLOUDS & SEAGULLS -->
      <g id="cloudsLayer" opacity="0.92"></g>
      <g id="seagullsLayer"></g>

      <!-- 3. DISTANT OCEAN & HILLS -->
      <rect x="0" y="348" width="960" height="65" fill="url(#oceanGrad)" />
      <g id="wavesLayer" opacity="0.45"></g>

      <!-- Distant Sailboat -->
      <g id="sailboat" transform="translate(210, 345)">
        <polygon points="-18,0 18,0 12,8 -12,8" fill="#78350f" />
        <polygon points="-2,-2 0,-36 16,-4" fill="#ffffff" />
        <polygon points="-4,-4 -2,-30 -15,-6" fill="#f1f5f9" />
      </g>

      <!-- Parallax Rolling Hills -->
      <g id="farHillsLayer"></g>
      <g id="nearHillsLayer"></g>

      <!-- Boardwalk Railing / Coastal Grass -->
      <rect x="0" y="405" width="960" height="32" fill="#86efac" />
      <rect x="0" y="428" width="960" height="12" fill="#4ade80" />
      <g id="grassLayer"></g>

      <!-- 4. ROAD -->
      <rect x="0" y="438" width="960" height="162" fill="url(#roadGrad)" />
      <line x1="0" y1="440" x2="960" y2="440" stroke="#cbd5e1" stroke-width="3" opacity="0.7" />
      <line x1="0" y1="548" x2="960" y2="548" stroke="#475569" stroke-width="2" />
      <g id="roadDashes"></g>
      <g id="pebblesLayer"></g>

      <!-- Ground Shadow under Bike -->
      <ellipse id="bikeShadow" cx="480" cy="490" rx="225" ry="14" fill="#0f172a" opacity="0.38" />

      <!-- 5. MAIN PELICAN & BICYCLE RIG -->
      <g id="rigGroup" filter="url(#softShadow)">

        <!-- FAR WING (Left Wing reaching handlebar) -->
        <g id="leftWingGroup">
          <path id="leftWingUpper" d="M 455 212 Q 498 228 556 244" fill="none" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round" />
          <path d="M 462 216 Q 505 236 554 244" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" opacity="0.6" />
        </g>

        <!-- FAR LEG (Left Leg behind bicycle frame) -->
        <g id="leftLegGroup">
          <!-- Far Pedal Assembly -->
          <line id="leftCrank" x1="455" y1="407" x2="455" y2="373" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
          <!-- Thigh & Shin -->
          <line id="leftThigh" x1="400" y1="268" x2="460" y2="330" stroke="#e2e8f0" stroke-width="16" stroke-linecap="round" />
          <line id="leftShin" x1="460" y1="330" x2="455" y2="373" stroke="#d97706" stroke-width="9" stroke-linecap="round" />
          <circle id="leftKnee" cx="460" cy="330" r="7" fill="#f59e0b" />
          <!-- Webbed Foot -->
          <g id="leftFoot">
            <path d="M -10 -4 L 24 -2 L 30 6 L -12 6 Z" fill="#ea580c" />
            <rect x="-16" y="4" width="34" height="7" rx="3" fill="#334155" />
          </g>
        </g>

        <!-- BICYCLE WHEELS -->
        <!-- Rear Wheel (330, 407), R = 78 -->
        <g id="rearWheel" transform="translate(330, 407)">
          <circle r="78" fill="none" stroke="#1e293b" stroke-width="14" />
          <circle r="71" fill="none" stroke="#fef3c7" stroke-width="4" />
          <circle r="66" fill="none" stroke="#cbd5e1" stroke-width="3.5" />
          <g id="rearSpokes"></g>
          <!-- Valve & Reflector -->
          <circle cx="0" cy="-48" r="5" fill="#f59e0b" />
          <circle r="14" fill="#475569" stroke="#cbd5e1" stroke-width="3" />
        </g>

        <!-- Front Wheel (630, 407), R = 78 -->
        <g id="frontWheel" transform="translate(630, 407)">
          <circle r="78" fill="none" stroke="#1e293b" stroke-width="14" />
          <circle r="71" fill="none" stroke="#fef3c7" stroke-width="4" />
          <circle r="66" fill="none" stroke="#cbd5e1" stroke-width="3.5" />
          <g id="frontSpokes"></g>
          <circle cx="0" cy="48" r="5" fill="#f59e0b" />
          <circle r="12" fill="#475569" stroke="#cbd5e1" stroke-width="3" />
        </g>

        <!-- FENDERS -->
        <path d="M 243 407 A 87 87 0 0 1 408 368" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
        <path d="M 552 365 A 87 87 0 0 1 715 395" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />

        <!-- CHAIN & SPROCKET -->
        <g id="drivetrain">
          <!-- Upper & Lower Chain loop -->
          <path id="bikeChain" d="M 330 393 L 455 381 A 26 26 0 1 1 455 433 L 330 421 A 14 14 0 1 1 330 393 Z"
                fill="none" stroke="#334155" stroke-width="4.5" stroke-dasharray="7 5" />
          <circle cx="330" cy="407" r="14" fill="none" stroke="#64748b" stroke-width="4" />
        </g>

        <!-- BICYCLE FRAME -->
        <g id="bikeFrame">
          <!-- Rear Rack -->
          <path d="M 330 407 L 305 312 L 385 312" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Small Wooden Crate with Fish on Rear Rack -->
          <g id="rearBasket" transform="translate(292, 276)">
            <rect x="0" y="0" width="66" height="34" rx="5" fill="#d97706" stroke="#92400e" stroke-width="2.5" />
            <line x1="4" y1="12" x2="62" y2="12" stroke="#92400e" stroke-width="2" />
            <line x1="4" y1="23" x2="62" y2="23" stroke="#92400e" stroke-width="2" />
            <!-- Blue fish tail sticking out of crate -->
            <path d="M 24 0 C 20 -16, 36 -18, 34 0 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
            <polygon points="27,-14 18,-25 29,-20 38,-25 31,-14" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
          </g>

          <!-- Seat post & Handlebars Stem (Chrome) -->
          <line x1="395" y1="298" x2="387" y2="274" stroke="url(#chromeGrad)" stroke-width="9" stroke-linecap="round" />
          <path d="M 582 280 L 594 240 Q 596 232 584 234 L 548 248" fill="none" stroke="url(#chromeGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Main Red Diamond Frame -->
          <!-- Chainstay -->
          <line x1="330" y1="407" x2="455" y2="407" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" />
          <!-- Seatstay -->
          <line x1="330" y1="407" x2="395" y2="298" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" />
          <!-- Seat tube -->
          <line x1="455" y1="407" x2="395" y2="298" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round" />
          <!-- Down tube -->
          <line x1="455" y1="407" x2="586" y2="306" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" />
          <!-- Top tube (cruiser curve) -->
          <path d="M 396 302 Q 490 302 582 284" fill="none" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round" />
          <!-- Head tube -->
          <line x1="580" y1="276" x2="590" y2="314" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round" />
          <!-- Front Fork -->
          <path d="M 586 308 Q 605 365 630 407" fill="none" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" />

          <!-- Vintage Headlight -->
          <g transform="translate(604, 290)">
            <polygon id="headlightBeam" points="14,0 190,-35 190,55" fill="#fef08a" opacity="0.0" />
            <path d="M -8 -9 L 10 -12 A 12 12 0 0 1 10 12 L -8 9 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
            <ellipse cx="10" cy="0" rx="4" ry="10" fill="#fef08a" />
          </g>

          <!-- Bicycle Bell on Handlebar -->
          <g id="bellGroup" transform="translate(572, 232)">
            <path d="M -9 0 A 9 9 0 0 1 9 0 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.8" />
            <rect x="-4" y="0" width="8" height="4" fill="#475569" />
            <g id="bellRings" opacity="0">
              <path d="M -14 -8 A 16 16 0 0 1 14 -8" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
              <path d="M -20 -14 A 24 24 0 0 1 20 -14" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
            </g>
          </g>

          <!-- Leather Saddle -->
          <path d="M 362 274 Q 385 266 416 276 Q 422 281 412 285 Q 385 284 365 286 Q 355 282 362 274 Z"
                fill="#78350f" stroke="#451a03" stroke-width="2.5" />

          <!-- Crankset / Chainring -->
          <g id="chainringGroup" transform="translate(455, 407)">
            <circle r="26" fill="#e2e8f0" stroke="#475569" stroke-width="4" />
            <circle r="19" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" />
            <circle r="7" fill="#334155" />
          </g>
        </g>

        <!-- PELICAN TORSO, NECK & HEAD -->
        <g id="pelicanBodyGroup">
          <!-- Tail Feathers resting behind saddle -->
          <g id="pelicanTail">
            <path d="M 380 258 L 340 245 L 352 262 L 336 268 L 368 273 Z"
                  fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" />
          </g>

          <!-- Plump Pelican Body -->
          <path d="M 374 260
                   C 365 220, 405 182, 456 190
                   C 488 195, 502 225, 488 258
                   C 474 284, 412 288, 374 260 Z"
                fill="url(#pelicanBody)" stroke="#cbd5e1" stroke-width="2.5" />

          <!-- Soft Belly Feather Highlight -->
          <path d="M 395 266 Q 445 280 480 250" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.45" />

          <!-- S-Curved Neck (Animated dynamically for smooth bobbing) -->
          <path id="pelicanNeck"
                d="M 466 205 C 448 172, 462 140, 484 114"
                fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" />
          <path id="pelicanNeckShadow"
                d="M 466 205 C 448 172, 462 140, 484 114"
                fill="none" stroke="#f1f5f9" stroke-width="24" stroke-linecap="round" />

          <!-- Red Scarf fluttering behind neck -->
          <g id="scarfGroup" transform="translate(465, 192)">
            <path id="scarfTail1" d="M 0 0 Q -42 -8 -78 6 Q -52 18 -4 10 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
            <path id="scarfTail2" d="M -5 6 Q -38 14 -64 26 Q -35 28 2 12 Z" fill="#dc2626" />
            <ellipse cx="4" cy="4" rx="18" ry="8" transform="rotate(18)" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
          </g>

          <!-- PELICAN HEAD & GIANT BEAK -->
          <g id="pelicanHeadGroup" transform="translate(486, 108)">
            <!-- Tuft of Feathers at back of head -->
            <path d="M -18 -8 L -36 -18 L -24 -2 L -38 4 L -16 6 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

            <!-- Skull / Head -->
            <ellipse cx="0" cy="0" rx="25" ry="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

            <!-- Cute Captain / Cycling Cap -->
            <g transform="translate(-4, -18) rotate(-8)">
              <path d="M -20 4 C -20 -14, 18 -14, 20 4 Z" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
              <path d="M 10 2 L 32 6 Q 22 10 6 5 Z" fill="#0f172a" />
              <circle cx="0" cy="-9" r="3.5" fill="#facc15" />
            </g>

            <!-- Gular Pouch (Elastic Throat Sac underneath beak) -->
            <path id="gularPouch"
                  d="M 12 8
                     C 32 76, 108 78, 138 14
                     Q 75 16 12 8 Z"
                  fill="url(#pouchGrad)" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round" />

            <!-- Pouch Stretch Ridges -->
            <path id="pouchRidge1" d="M 28 14 Q 65 55 112 15" fill="none" stroke="#fdba74" stroke-width="1.6" opacity="0.55" />
            <path id="pouchRidge2" d="M 42 15 Q 75 42 104 15" fill="none" stroke="#fed7aa" stroke-width="1.4" opacity="0.45" />

            <!-- Little Fish peeking out of the Beak Pouch -->
            <g id="pouchFish" transform="translate(78, 22)">
              <path d="M -14 0 Q 2 -12 18 -2 Q 4 10 -14 0 Z" fill="#38bdf8" stroke="#0369a1" stroke-width="1.5" />
              <polygon points="16,-2 27,-10 24,-1 28,6" fill="#0ea5e9" stroke="#0369a1" stroke-width="1.2" />
              <circle cx="-6" cy="-2" r="2" fill="#0f172a" />
            </g>

            <!-- Upper Mandible (Long Iconic Pelican Beak) -->
            <path d="M 8 -8
                     L 138 4
                     Q 148 6 145 16
                     Q 140 22 134 15
                     L 10 10 Z"
                  fill="url(#upperBeakGrad)" stroke="#d97706" stroke-width="2" stroke-linejoin="round" />

            <!-- Nostril slit -->
            <line x1="34" y1="-1" x2="44" y2="0" stroke="#92400e" stroke-width="2" stroke-linecap="round" />

            <!-- Eye Patch & Expressive Eye -->
            <circle cx="8" cy="-4" r="9" fill="#fef08a" opacity="0.7" />
            <g id="pelicanEye" transform="translate(8, -4)">
              <circle r="6" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
              <circle cx="2" cy="0" r="3.2" fill="#0f172a" />
              <circle cx="3" cy="-1.5" r="1.2" fill="#ffffff" />
            </g>

            <!-- Cheek blush -->
            <ellipse cx="2" cy="6" rx="5.5" ry="3" fill="#fb7185" opacity="0.45" />
          </g>
        </g>

        <!-- NEAR LEG (Right Leg in front of bicycle frame) -->
        <g id="rightLegGroup">
          <!-- Front Crank Arm -->
          <line id="rightCrank" x1="455" y1="407" x2="455" y2="441" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round" />
          <circle cx="455" cy="407" r="6" fill="#1e293b" />

          <!-- Fluffy Feather Hip Joint Cover -->
          <ellipse id="rightHipFluff" cx="400" cy="268" rx="18" ry="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

          <!-- Thigh & Shin (2-Bone IK) -->
          <line id="rightThigh" x1="400" y1="268" x2="475" y2="335" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
          <line id="rightThighShade" x1="400" y1="268" x2="475" y2="335" stroke="#f8fafc" stroke-width="13" stroke-linecap="round" />
          <line id="rightShin" x1="475" y1="335" x2="455" y2="441" stroke="#f59e0b" stroke-width="9.5" stroke-linecap="round" />
          <circle id="rightKnee" cx="475" cy="335" r="7.5" fill="#fbbf24" stroke="#d97706" stroke-width="2" />

          <!-- Webbed Right Foot & Pedal -->
          <g id="rightFoot">
            <path d="M -10 -5 L 26 -2 L 32 6 L -12 6 Z" fill="#f97316" stroke="#c2410c" stroke-width="1.8" stroke-linejoin="round" />
            <line x1="4" y1="-2" x2="22" y2="3" stroke="#fed7aa" stroke-width="1.5" opacity="0.7" />
            <rect x="-17" y="4" width="36" height="7.5" rx="3.5" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
            <rect x="-10" y="6" width="22" height="3" rx="1.5" fill="#f59e0b" />
          </g>
        </g>

        <!-- NEAR WING (Right Wing holding the handlebar grip) -->
        <g id="rightWingGroup">
          <!-- Shoulder to Elbow to Handlebar Grip (552, 248) -->
          <path id="rightWingShape"
                d="M 446 208
                   C 438 242, 474 266, 552 248
                   C 558 246, 558 238, 548 238
                   C 496 244, 480 222, 464 204 Z"
                fill="url(#pelicanWing)" stroke="#94a3b8" stroke-width="2.2" stroke-linejoin="round" />
          <!-- Wing Feather Details -->
          <path id="rightWingFeathers"
                d="M 456 236 Q 485 246 512 242 M 468 246 Q 498 254 528 246"
                fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
          <!-- Handlebar Grip -->
          <rect x="540" y="242" width="22" height="10" rx="5" transform="rotate(-12 551 247)" fill="#451a03" />
        </g>

      </g>

      <!-- 6. FOREGROUND SPEED LINES & SWEAT/WIND PARTICLES -->
      <g id="speedLinesLayer"></g>
    </svg>
  </div>

  <!-- Interactive Controls -->
  <div class="hud">
    <label>
      <span>🚴 骑行速度</span>
      <input id="speedSlider" type="range" min="0.2" max="2.8" step="0.1" value="1.2" />
      <span id="speedValue">1.2x</span>
    </label>
    <button id="sprintBtn" class="btn">⚡ 冲刺加速</button>
    <button id="bellBtn" class="btn">🔔 按车铃</button>
    <button id="fishBtn" class="btn active">🐟 嘴里藏鱼</button>
    <button id="themeBtn" class="btn">🌅 切换黄昏</button>
  </div>

  <script>
    (() => {
      const svgNS = "http://www.w3.org/2000/svg";

      // --- Scene Geometry Constants ---
      const BB = { x: 455, y: 407 };         // Bottom bracket (crank center)
      const CRANK_R = 34;                    // Crank arm length
      const HIP_BASE = { x: 400, y: 268 };   // Pelican hip on saddle
      const THIGH_LEN = 98;                  // Upper leg length (L1)
      const SHIN_LEN = 102;                  // Lower leg length (L2)
      // Note: L1 + L2 = 200 > max hip-to-pedal distance (~183), so feet NEVER detach!

      // --- DOM References ---
      const rearSpokes = document.getElementById("rearSpokes");
      const frontSpokes = document.getElementById("frontSpokes");
      const chainringGroup = document.getElementById("chainringGroup");
      const bikeChain = document.getElementById("bikeChain");

      const leftCrank = document.getElementById("leftCrank");
      const leftThigh = document.getElementById("leftThigh");
      const leftShin = document.getElementById("leftShin");
      const leftKnee = document.getElementById("leftKnee");
      const leftFoot = document.getElementById("leftFoot");

      const rightCrank = document.getElementById("rightCrank");
      const rightHipFluff = document.getElementById("rightHipFluff");
      const rightThigh = document.getElementById("rightThigh");
      const rightThighShade = document.getElementById("rightThighShade");
      const rightShin = document.getElementById("rightShin");
      const rightKnee = document.getElementById("rightKnee");
      const rightFoot = document.getElementById("rightFoot");

      const rigGroup = document.getElementById("rigGroup");
      const pelicanBodyGroup = document.getElementById("pelicanBodyGroup");
      const pelicanHeadGroup = document.getElementById("pelicanHeadGroup");
      const pelicanNeck = document.getElementById("pelicanNeck");
      const pelicanNeckShadow = document.getElementById("pelicanNeckShadow");
      const pelicanTail = document.getElementById("pelicanTail");
      const pelicanEye = document.getElementById("pelicanEye");
      const gularPouch = document.getElementById("gularPouch");
      const pouchRidge1 = document.getElementById("pouchRidge1");
      const pouchRidge2 = document.getElementById("pouchRidge2");
      const pouchFish = document.getElementById("pouchFish");
      const rightWingShape = document.getElementById("rightWingShape");
      const leftWingUpper = document.getElementById("leftWingUpper");
      const scarfTail1 = document.getElementById("scarfTail1");
      const scarfTail2 = document.getElementById("scarfTail2");
      const bikeShadow = document.getElementById("bikeShadow");
      const bellRings = document.getElementById("bellRings");

      // --- Build 12 Spokes per Wheel ---
      function buildSpokes(container) {
        for (let i = 0; i < 12; i++) {
          const angle = (i * Math.PI) / 6;
          const line = document.createElementNS(svgNS, "line");
          line.setAttribute("x1", "0");
          line.setAttribute("y1", "0");
          line.setAttribute("x2", (Math.cos(angle) * 66).toFixed(1));
          line.setAttribute("y2", (Math.sin(angle) * 66).toFixed(1));
          line.setAttribute("stroke", "#e2e8f0");
          line.setAttribute("stroke-width", "1.8");
          container.appendChild(line);
        }
      }
      buildSpokes(rearSpokes);
      buildSpokes(frontSpokes);

      // --- Build Scrolling Environment Elements ---
      const cloudsLayer = document.getElementById("cloudsLayer");
      const clouds = [
        { x: 110, y: 78, scale: 1.0, speed: 14 },
        { x: 420, y: 56, scale: 0.75, speed: 10 },
        { x: 760, y: 92, scale: 1.15, speed: 18 },
        { x: 980, y: 65, scale: 0.85, speed: 12 }
      ].map((c) => {
        const g = document.createElementNS(svgNS, "g");
        g.innerHTML = `
          <path d="M -45 10 Q -52 -12 -28 -16 Q -14 -36 16 -24 Q 42 -28 48 -4 Q 65 -2 60 14 Q 60 22 -42 22 Z"
                fill="#ffffff" opacity="0.88" />
        `;
        cloudsLayer.appendChild(g);
        return { ...c, el: g };
      });

      // Seagulls
      const seagullsLayer = document.getElementById("seagullsLayer");
      const gulls = [
        { x: 250, y: 120, phase: 0, scale: 0.8 },
        { x: 290, y: 138, phase: 1.5, scale: 0.65 },
        { x: 640, y: 88, phase: 3.1, scale: 0.75 }
      ].map((gull) => {
        const path = document.createElementNS(svgNS, "path");
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#475569");
        path.setAttribute("stroke-width", "2.2");
        path.setAttribute("stroke-linecap", "round");
        seagullsLayer.appendChild(path);
        return { ...gull, el: path };
      });

      // Parallax Hills
      const farHillsLayer = document.getElementById("farHillsLayer");
      const nearHillsLayer = document.getElementById("nearHillsLayer");

      const hills = [];
      for (let i = 0; i < 6; i++) {
        const el = document.createElementNS(svgNS, "path");
        el.setAttribute("fill", "#2dd4bf");
        el.setAttribute("opacity", "0.55");
        farHillsLayer.appendChild(el);
        hills.push({ x: i * 240, w: 320, h: 52 + (i % 2) * 18, baseY: 406, speed: 45, el });
      }
      for (let i = 0; i < 6; i++) {
        const el = document.createElementNS(svgNS, "path");
        el.setAttribute("fill", "#10b981");
        nearHillsLayer.appendChild(el);
        hills.push({ x: i * 220 - 60, w: 280, h: 34 + ((i + 1) % 2) * 14, baseY: 408, speed: 85, el });
      }

      // Grass Tufts
      const grassLayer = document.getElementById("grassLayer");
      const grasses = [];
      for (let i = 0; i < 16; i++) {
        const path = document.createElementNS(svgNS, "path");
        path.setAttribute("d", "M 0 0 L -5 -12 L -1 -3 L 3 -14 L 5 -2 L 10 -10 L 6 0 Z");
        path.setAttribute("fill", "#16a34a");
        grassLayer.appendChild(path);
        grasses.push({ x: i * 68, y: 432, el: path });
      }

      // Road Dashes
      const roadDashes = document.getElementById("roadDashes");
      const dashes = [];
      for (let i = 0; i < 11; i++) {
        const rect = document.createElementNS(svgNS, "rect");
        rect.setAttribute("y", "492");
        rect.setAttribute("width", "54");
        rect.setAttribute("height", "7");
        rect.setAttribute("rx", "3.5");
        rect.setAttribute("fill", "#facc15");
        rect.setAttribute("opacity", "0.85");
        roadDashes.appendChild(rect);
        dashes.push({ x: i * 100, el: rect });
      }

      // Road Pebbles
      const pebblesLayer = document.getElementById("pebblesLayer");
      const pebbles = [];
      for (let i = 0; i < 20; i++) {
        const c = document.createElementNS(svgNS, "circle");
        const y = i % 2 === 0 ? 456 + (i * 7) % 24 : 518 + (i * 11) % 25;
        c.setAttribute("cy", y);
        c.setAttribute("r", (1.5 + (i % 3)).toString());
        c.setAttribute("fill", "#64748b");
        c.setAttribute("opacity", "0.55");
        pebblesLayer.appendChild(c);
        pebbles.push({ x: i * 52, el: c });
      }

      // Speed Lines
      const speedLinesLayer = document.getElementById("speedLinesLayer");
      const speedLines = [];
      for (let i = 0; i < 7; i++) {
        const line = document.createElementNS(svgNS, "line");
        const y = 160 + i * 52;
        line.setAttribute("y1", y);
        line.setAttribute("y2", y);
        line.setAttribute("stroke", "#ffffff");
        line.setAttribute("stroke-width", "2");
        line.setAttribute("stroke-linecap", "round");
        speedLinesLayer.appendChild(line);
        speedLines.push({
          x: (i * 170) % 960,
          len: 45 + (i % 3) * 25,
          el: line
        });
      }

      // --- 2-Bone Inverse Kinematics Solver ---
      // Solves knee joint (kx, ky) from hip (hx, hy) to pedal (px, py) with forward knee bend
      function solveIK(hx, hy, px, py, L1, L2) {
        const dx = px - hx;
        const dy = py - hy;
        let dist = Math.hypot(dx, dy);
        const maxReach = L1 + L2 - 0.5;
        const minReach = Math.abs(L1 - L2) + 0.5;
        dist = Math.max(minReach, Math.min(maxReach, dist));

        const baseAngle = Math.atan2(dy, dx);
        const cosAlpha = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
        const alpha = Math.acos(Math.max(-1, Math.min(1, cosAlpha)));

        // Subtract alpha so the knee bends forward (+X direction toward front of bike)
        const thighAngle = baseAngle - alpha;
        const kx = hx + Math.cos(thighAngle) * L1;
        const ky = hy + Math.sin(thighAngle) * L1;
        return { kx, ky };
      }

      // --- Interactive State ---
      let speedMultiplier = 1.2;
      let sprintBoost = 0;
      let bellTimer = 0;
      let showFish = true;
      let isSunset = false;
      let pedalAngle = 0;
      let lastTime = performance.now();

      const speedSlider = document.getElementById("speedSlider");
      const speedValue = document.getElementById("speedValue");
      const sprintBtn = document.getElementById("sprintBtn");
      const bellBtn = document.getElementById("bellBtn");
      const fishBtn = document.getElementById("fishBtn");
      const themeBtn = document.getElementById("themeBtn");
      const skyRect = document.getElementById("skyRect");
      const sunGroup = document.getElementById("sunGroup");
      const headlightBeam = document.getElementById("headlightBeam");

      speedSlider.addEventListener("input", (e) => {
        speedMultiplier = parseFloat(e.target.value);
        speedValue.textContent = speedMultiplier.toFixed(1) + "x";
      });

      sprintBtn.addEventListener("click", () => {
        sprintBoost = 1.8;
      });

      // Synthesize a cheerful bicycle bell "ding-ring!" with Web Audio API
      function playBellSound() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          [0, 0.11].forEach((delay, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(idx === 0 ? 1760 : 2093, ctx.currentTime + delay);
            gain.gain.setValueAtTime(0.22, ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.65);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + delay);
            osc.stop(ctx.currentTime + delay + 0.65);
          });
        } catch (_) {}
      }

      bellBtn.addEventListener("click", () => {
        bellTimer = 0.7;
        playBellSound();
      });

      fishBtn.addEventListener("click", () => {
        showFish = !showFish;
        pouchFish.style.display = showFish ? "block" : "none";
        fishBtn.classList.toggle("active", showFish);
      });

      themeBtn.addEventListener("click", () => {
        isSunset = !isSunset;
        skyRect.setAttribute("fill", isSunset ? "url(#skySunset)" : "url(#skyDay)");
        sunGroup.setAttribute("transform", isSunset ? "translate(770, 265)" : "translate(770, 115)");
        headlightBeam.setAttribute("opacity", isSunset ? "0.32" : "0.0");
        themeBtn.classList.toggle("active", isSunset);
        themeBtn.textContent = isSunset ? "☀️ 切换白天" : "🌅 切换黄昏";
      });

      // --- Main Animation Loop ---
      function animate(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        if (sprintBoost > 0) {
          sprintBoost = Math.max(0, sprintBoost - dt * 0.9);
        }
        const effectiveSpeed = speedMultiplier + sprintBoost;

        // Advance crank rotation (clockwise in screen space = forward pedaling)
        const angularVel = effectiveSpeed * 4.4; // rad/s
        pedalAngle += angularVel * dt;

        // Wheel rotation in degrees (wheel radius 78, gear ratio ~ 1.7)
        const wheelDeg = ((pedalAngle * 1.75 * 180) / Math.PI) % 360;
        rearSpokes.parentElement.setAttribute("transform", `translate(330, 407) rotate(${wheelDeg.toFixed(1)})`);
        frontSpokes.parentElement.setAttribute("transform", `translate(630, 407) rotate(${wheelDeg.toFixed(1)})`);
        chainringGroup.setAttribute("transform", `translate(455, 407) rotate(${((pedalAngle * 180) / Math.PI) % 360})`);
        bikeChain.setAttribute("stroke-dashoffset", (-pedalAngle * 26).toFixed(1));

        // Subtle whole-bike suspension bounce + pelican body bobbing (twice per pedal cycle)
        const cycle2 = pedalAngle * 2;
        const bodyBobY = Math.sin(cycle2) * 5.2;
        const bodyPitch = Math.cos(cycle2) * 1.6;
        const bikeBounceY = Math.sin(cycle2 - 0.5) * 1.5;

        rigGroup.setAttribute("transform", `translate(0, ${bikeBounceY.toFixed(2)})`);
        bikeShadow.setAttribute("rx", (225 + bodyBobY * 1.8).toFixed(1));

        // Hip moves with the pelican's torso
        const hx = HIP_BASE.x;
        const hy = HIP_BASE.y + bodyBobY;

        // --- RIGHT LEG (Near side, phase = pedalAngle) ---
        const rPx = BB.x + Math.cos(pedalAngle) * CRANK_R;
        const rPy = BB.y + Math.sin(pedalAngle) * CRANK_R;
        const rKnee = solveIK(hx, hy, rPx, rPy, THIGH_LEN, SHIN_LEN);

        rightCrank.setAttribute("x2", rPx.toFixed(1));
        rightCrank.setAttribute("y2", rPy.toFixed(1));
        rightHipFluff.setAttribute("cx", hx.toFixed(1));
        rightHipFluff.setAttribute("cy", hy.toFixed(1));

        rightThigh.setAttribute("x1", hx.toFixed(1));
        rightThigh.setAttribute("y1", hy.toFixed(1));
        rightThigh.setAttribute("x2", rKnee.kx.toFixed(1));
        rightThigh.setAttribute("y2", rKnee.ky.toFixed(1));

        rightThighShade.setAttribute("x1", hx.toFixed(1));
        rightThighShade.setAttribute("y1", hy.toFixed(1));
        rightThighShade.setAttribute("x2", rKnee.kx.toFixed(1));
        rightThighShade.setAttribute("y2", rKnee.ky.toFixed(1));

        rightShin.setAttribute("x1", rKnee.kx.toFixed(1));
        rightShin.setAttribute("y1", rKnee.ky.toFixed(1));
        rightShin.setAttribute("x2", rPx.toFixed(1));
        rightShin.setAttribute("y2", rPy.toFixed(1));

        rightKnee.setAttribute("cx", rKnee.kx.toFixed(1));
        rightKnee.setAttribute("cy", rKnee.ky.toFixed(1));

        const rFootTilt = Math.sin(pedalAngle) * 10;
        rightFoot.setAttribute("transform", `translate(${rPx.toFixed(1)}, ${rPy.toFixed(1)}) rotate(${rFootTilt.toFixed(1)})`);

        // --- LEFT LEG (Far side, phase = pedalAngle + PI) ---
        const lAngle = pedalAngle + Math.PI;
        const lPx = BB.x + Math.cos(lAngle) * CRANK_R;
        const lPy = BB.y + Math.sin(lAngle) * CRANK_R;
        const lKnee = solveIK(hx, hy, lPx, lPy, THIGH_LEN, SHIN_LEN);

        leftCrank.setAttribute("x2", lPx.toFixed(1));
        leftCrank.setAttribute("y2", lPy.toFixed(1));

        leftThigh.setAttribute("x1", hx.toFixed(1));
        leftThigh.setAttribute("y1", hy.toFixed(1));
        leftThigh.setAttribute("x2", lKnee.kx.toFixed(1));
        leftThigh.setAttribute("y2", lKnee.ky.toFixed(1));

        leftShin.setAttribute("x1", lKnee.kx.toFixed(1));
        leftShin.setAttribute("y1", lKnee.ky.toFixed(1));
        leftShin.setAttribute("x2", lPx.toFixed(1));
        leftShin.setAttribute("y2", lPy.toFixed(1));

        leftKnee.setAttribute("cx", lKnee.kx.toFixed(1));
        leftKnee.setAttribute("cy", lKnee.ky.toFixed(1));

        const lFootTilt = Math.sin(lAngle) * 10;
        leftFoot.setAttribute("transform", `translate(${lPx.toFixed(1)}, ${lPy.toFixed(1)}) rotate(${lFootTilt.toFixed(1)})`);

        // --- PELICAN BODY, HEAD & ELASTIC POUCH ---
        pelicanBodyGroup.setAttribute(
          "transform",
          `translate(0, ${bodyBobY.toFixed(2)}) rotate(${bodyPitch.toFixed(2)} 430 250)`
        );

        // Head nods with a slight phase delay
        const headBobY = Math.sin(cycle2 - 0.7) * 3.5;
        const headNod = Math.sin(cycle2 - 0.9) * 3.2 - sprintBoost * 4;
        pelicanHeadGroup.setAttribute(
          "transform",
          `translate(486, ${(108 + headBobY).toFixed(2)}) rotate(${headNod.toFixed(2)})`
        );

        // Neck curve connects torso to nodding head seamlessly
        const neckD = `M 466 205 C 446 ${(172 + headBobY * 0.5).toFixed(1)}, 462 ${(140 + headBobY * 0.8).toFixed(1)}, 484 ${(112 + headBobY).toFixed(1)}`;
        pelicanNeck.setAttribute("d", neckD);
        pelicanNeckShadow.setAttribute("d", neckD);

        // Gular pouch jiggles like a water balloon
        const pouchDrop = 76 + Math.sin(cycle2 - 1.35) * 9.5 * Math.min(1.6, effectiveSpeed);
        gularPouch.setAttribute(
          "d",
          `M 12 8 C 32 ${pouchDrop.toFixed(1)}, 108 ${(pouchDrop + 2).toFixed(1)}, 138 14 Q 75 16 12 8 Z`
        );
        pouchRidge1.setAttribute("d", `M 28 14 Q 65 ${(pouchDrop * 0.72).toFixed(1)} 112 15`);
        pouchRidge2.setAttribute("d", `M 42 15 Q 75 ${(pouchDrop * 0.55).toFixed(1)} 104 15`);

        // Fish inside pouch bobs up and down
        const fishBob = Math.sin(cycle2 - 1.1) * 4.5;
        const fishRot = Math.cos(cycle2 - 1.1) * 8;
        pouchFish.setAttribute("transform", `translate(78, ${(22 + fishBob).toFixed(1)}) rotate(${fishRot.toFixed(1)})`);

        // Tail wag
        const tailWag = Math.sin(cycle2 + 0.5) * 5;
        pelicanTail.setAttribute("transform", `rotate(${tailWag.toFixed(1)} 378 262)`);

        // Periodic Eye Blink
        const blinkCycle = (now * 0.001) % 4.2;
        const eyeScaleY = blinkCycle > 4.05 ? 0.12 : 1;
        pelicanEye.setAttribute("transform", `translate(8, -4) scale(1, ${eyeScaleY})`);

        // Wings stay anchored to handlebar (552, 248) while shoulder moves with bodyBobY
        const shoulderY = 208 + bodyBobY;
        const elbowY = 258 + bodyBobY * 0.6 + Math.sin( pedalAngle ) * 3;
        rightWingShape.setAttribute(
          "d",
          `M 446 ${shoulderY.toFixed(1)}
           C 438 ${elbowY.toFixed(1)}, 474 ${(elbowY + 8).toFixed(1)}, 552 248
           C 558 246, 558 238, 548 238
           C 496 ${(elbowY - 12).toFixed(1)}, 480 ${(shoulderY + 14).toFixed(1)}, 464 ${(shoulderY - 4).toFixed(1)} Z`
        );
        leftWingUpper.setAttribute(
          "d",
          `M 455 ${(212 + bodyBobY).toFixed(1)} Q 498 ${(228 + bodyBobY * 0.5).toFixed(1)} 556 244`
        );

        // Red Scarf fluttering in the wind
        const scarfWave1 = Math.sin(now * 0.014 * effectiveSpeed) * 9;
        const scarfWave2 = Math.cos(now * 0.014 * effectiveSpeed) * 8;
        scarfTail1.setAttribute("d", `M 0 0 Q -42 ${(-8 + scarfWave1).toFixed(1)} -82 ${(4 - scarfWave1).toFixed(1)} Q -52 ${(18 + scarfWave1 * 0.5).toFixed(1)} -4 10 Z`);
        scarfTail2.setAttribute("d", `M -5 6 Q -38 ${(14 + scarfWave2).toFixed(1)} -68 ${(24 - scarfWave2).toFixed(1)} Q -35 28 2 12 Z`);

        // Bell ring visual effect
        if (bellTimer > 0) {
          bellTimer = Math.max(0, bellTimer - dt);
          bellRings.setAttribute("opacity", (bellTimer / 0.7).toFixed(2));
          bellRings.setAttribute("transform", `scale(${(1 + (0.7 - bellTimer) * 0.4).toFixed(2)})`);
        } else {
          bellRings.setAttribute("opacity", "0");
        }

        // --- SCROLLING PARALLAX BACKGROUND ---
        const roadSpeed = 270 * effectiveSpeed;

        // Clouds
        clouds.forEach((c) => {
          c.x -= c.speed * effectiveSpeed * dt;
          if (c.x < -100) c.x = 1060;
          c.el.setAttribute("transform", `translate(${c.x.toFixed(1)}, ${c.y}) scale(${c.scale})`);
        });

        // Seagulls flapping
        gulls.forEach((g) => {
          g.x -= 22 * effectiveSpeed * dt;
          if (g.x < -50) g.x = 1010;
          const flap = Math.sin(now * 0.007 + g.phase) * 7;
          g.el.setAttribute(
            "d",
            `M -14 ${flap.toFixed(1)} Q -7 ${(-6 + flap * 0.3).toFixed(1)} 0 0 Q 7 ${(-6 + flap * 0.3).toFixed(1)} 14 ${flap.toFixed(1)}`
          );
          g.el.setAttribute("transform", `translate(${g.x.toFixed(1)}, ${g.y}) scale(${g.scale})`);
        });

        // Parallax Hills
        hills.forEach((h) => {
          h.x -= h.speed * effectiveSpeed * dt;
          if (h.x < -h.w) h.x += 6 * (h.speed === 45 ? 240 : 220);
          h.el.setAttribute(
            "d",
            `M ${h.x.toFixed(1)} ${h.baseY} Q ${(h.x + h.w / 2).toFixed(1)} ${(h.baseY - h.h).toFixed(1)} ${(h.x + h.w).toFixed(1)} ${h.baseY} Z`
          );
        });

        // Grass tufts
        grasses.forEach((g) => {
          g.x -= roadSpeed * 0.85 * dt;
          if (g.x < -30) g.x += 16 * 68;
          g.el.setAttribute("transform", `translate(${g.x.toFixed(1)}, ${g.y})`);
        });

        // Road dashes
        dashes.forEach((d) => {
          d.x -= roadSpeed * dt;
          if (d.x < -70) d.x += 11 * 100;
          d.el.setAttribute("x", d.x.toFixed(1));
        });

        // Pebbles
        pebbles.forEach((p) => {
          p.x -= roadSpeed * dt;
          if (p.x < -20) p.x += 20 * 52;
          p.el.setAttribute("cx", p.x.toFixed(1));
        });

        // Speed lines (visible at higher speeds)
        const lineOpacity = Math.max(0, Math.min(0.65, (effectiveSpeed - 0.8) * 0.35));
        speedLines.forEach((s) => {
          s.x -= roadSpeed * 1.65 * dt;
          if (s.x < -120) s.x += 1080;
          s.el.setAttribute("x1", s.x.toFixed(1));
          s.el.setAttribute("x2", (s.x + s.len * effectiveSpeed).toFixed(1));
          s.el.setAttribute("opacity", lineOpacity.toFixed(2));
        });

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
